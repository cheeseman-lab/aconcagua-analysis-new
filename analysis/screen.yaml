# Screen Information
experiment:
  id: "aconcagua"
  notebook_entries: ""
  dates:
    start: ""
    end: ""

# Cellular Conditions
cellular:
  cell_line: "HeLa"
  imaging_timepoint: "78 hours"
  treatment:
    summary: "CRISPR knockout perturbation screen"
    details: "Optical Pooled Screen (OPS) using CRISPR knockout to perturb ~5,299 genes. Cells were imaged via fluorescence microscopy."
  plates: 8
  wells_per_plate: "5-6"

# Sequencing by Synthesis (SBS)
sbs:
  cycles: 11
  cycle_order: "1-11"
  background_channel: "DAPI"
  library_details:
    number_of_genes: 5299
    guides_per_gene: "~4 (20,445 total guides)"
    barcode_length: "11-mer"

# Phenotype (PH) Steps
phenotype:
  background_channel_cell: "DAPI"
  background_channel_body: "PHALLOIDIN"

  rounds:
    - round_number: 1
      stains:
        - name: "DAPI"
          marker_of: "Nuclei (DNA)"
          channel: "DAPI"
        - name: "Tubulin"
          marker_of: "Microtubules / Cytoskeleton"
          channel: "GFP"

    - round_number: 2
      stains:
        - name: "gamma-H2AX"
          marker_of: "DNA damage foci"
          channel: "A594"
        - name: "Phalloidin"
          marker_of: "Actin / Cell body"
          channel: "AF750"

# Data Generated
data:
  storage_format: "nd2"
  location: "/lab/ops_analysis_ssd/cheeseman/aconcagua-analysis-new/"
  notes: "Cell painting-derived panel: DAPI, Tubulin, gamma-H2AX, Phalloidin. Processed via brieflow pipeline."

# Data Provenance
provenance:
  processing_pipeline: "brieflow"
  pipeline_version: "visualizer_pro branch"
  dataset_version: "1.0"
