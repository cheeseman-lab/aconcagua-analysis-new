

# BrieFlow cluster configuration file

default-resources:
    slurm_partition: 20
    slurm_account: wibrusers
    mem_mb: 3000
    tasks: 1
    cpus_per_task: 1
    runtime: 800
    slurm_extra: "'--output=slurm/slurm_output/rule/%j.out'"
jobs: 200

set-resources:
   # preprocessing
    extract_metadata_sbs:
        mem_mb: 2000
    combine_metadata_sbs:
        mem_mb: 2500
    extract_metadata_phenotype:
        mem_mb: 2000
    combine_metadata_phenotype:
        mem_mb: 2500
    convert_sbs:
        mem_mb: 2000
    convert_ph:
        mem_mb: 2000
    calculate_ic_sbs:
        mem_mb: 100000
    calculate_ic_phenotype:
        mem_mb: 800000

    # sbs
    align_sbs:
        mem_mb: 6000
    log_filter:
        mem_mb: 6000
    compute_standard_deviation:
        mem_mb: 6000
    find_peaks:
        mem_mb: 6000
    max_filter:
        mem_mb: 5500
    apply_ic_field_sbs:
        mem_mb: 6000
    segment_sbs:
        # slurm_partition: "'nvidia-2080ti-20'"
        mem_mb: 7000
        cpus_per_task: 4
        # slurm_extra: "'--gres=gpu:1'"
    extract_bases:
        mem_mb: 4750
    call_reads:
        mem_mb: 5000
    call_cells:
        mem_mb: 5000
    extract_sbs_info:
        mem_mb: 4500
    combine_reads:
        mem_mb: 40000
    combine_cells:
        mem_mb: 40000
    combine_sbs_info:
        mem_mb: 60000
    eval_segmentation_sbs:
        mem_mb: 100000
    eval_mapping:
        mem_mb: 100000
        cpus_per_task: 72

    # phenotype
    apply_ic_field_phenotype:
        mem_mb: 4000
    align_phenotype:
        mem_mb: 4000
    segment_phenotype:
        # slurm_partition: "'nvidia-2080ti-20'"
        mem_mb: 5000
        cpus_per_task: 4
        # slurm_extra: "'--gres=gpu:1'"
    identify_cytoplasm:
        mem_mb: 3000
    extract_phenotype_info:
        mem_mb: 3000
    combine_phenotype_info:
        mem_mb: 22000
    extract_phenotype_cp:
        mem_mb: 4000
    merge_phenotype_cp:
        mem_mb: 300000
    eval_segmentation_phenotype:
        mem_mb: 10000
    eval_features:
        mem_mb: 10000

    # merge
    fast_alignment:
        mem_mb: 30000
        cpus_per_task: 4
    fast_merge:
        mem_mb: 20000
        cpus_per_task: 4
    format_merge:
        mem_mb: 20000
    eval_merge:
        mem_mb: 30000
    clean_merge:
        mem_mb: 20000
    deduplicate_merge:
        mem_mb: 20000
        cpus_per_task: 4
    final_merge:
        mem_mb: 500000
    estimate_stitch_phenotype:
        mem_mb: 15000    
        cpus_per_task: 12  
    estimate_stitch_sbs:
        mem_mb: 20000     
        cpus_per_task: 12  
    stitch_phenotype:
        mem_mb: 980000      
        cpus_per_task: 48   
    stitch_sbs:
        mem_mb: 980000       
        cpus_per_task: 48  
    stitch_alignment:
        mem_mb: 980000
        cpus_per_task: 48
    stitch_merge:
        mem_mb: 500000
        cpus_per_task: 12
    summarize_stitch:
        mem_mb: 20000

    # aggregate
    split_datasets:
        mem_mb: 300000
    filter:
        mem_mb: 200000
    generate_feature_table:
        mem_mb: 980000
        cpus_per_task: 4
        runtime: 2880  # 2 days
    align:
        mem_mb: 1300000
        cpus_per_task: 32
        runtime: 5760  # 4 days
    aggregate:
        mem_mb: 980000
        cpus_per_task: 4
    eval_aggregate:
        mem_mb: 980000
        cpus_per_task: 4
    # montages
    prepare_montage_data:
        mem_mb: 100000
        cpus_per_task: 8
    generate_montage:
        mem_mb: 10000
    initiate_montage:
        mem_mb: 1000
    # bootstrap
    prepare_bootstrap_data:
        mem_mb: 500000
        cpus_per_task: 4
    bootstrap_construct:
        mem_mb: 10000
    construct_bootstrap_complete:
        mem_mb: 1000
    bootstrap_gene:
        mem_mb: 20000
    initiate_bootstrap:
        mem_mb: 1000
    combine_bootstrap:
        mem_mb: 50000

    # cluster
    clean_aggregate:
        mem_mb: 10000
    phate_leiden_clustering:
        mem_mb: 10000
    benchmark_clusters:
        mem_mb: 10000
